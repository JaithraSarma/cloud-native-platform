services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cloudplatform-db
    environment:
      POSTGRES_DB: cloudplatform
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d cloudplatform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cloudplatform-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cloudplatform
      DB_USER: appuser
      DB_PASSWORD: apppassword
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudplatform-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - app-network

  # Prometheus (opt-in: docker compose --profile monitoring up)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cloudplatform-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - app-network

  # Grafana (opt-in: docker compose --profile monitoring up)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: cloudplatform-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      # Local development only - not for production
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
